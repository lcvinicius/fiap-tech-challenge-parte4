<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Avaliação | Tech Challenge</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="background">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
    </div>
    
    <main class="container">
        <div class="feedback-card">
            <header class="card-header">
                <h1>Deixe seu Feedback</h1>
                <p>Sua opinião é fundamental para melhorarmos sempre.</p>
            </header>
            
            <form id="feedbackForm" class="feedback-form">
                <div class="form-group">
                    <label for="nota">Como você avalia nossa plataforma?</label>
                    <div class="rating-container">
                        <input type="range" id="nota" name="nota" min="0" max="10" step="0.5" value="5.0">
                        <div class="score-display">
                            <span id="scoreValue">5.0</span>
                            <span class="score-max">/ 10</span>
                        </div>
                    </div>
                </div>
                
                <div class="form-group">
                    <label for="descricao">Conte-nos mais sobre sua experiência</label>
                    <textarea id="descricao" name="descricao" rows="4" placeholder="O que você mais gostou? O que podemos melhorar?" required></textarea>
                </div>
                
                <div id="alertBox" class="alert hidden">
                    <span id="alertMessage"></span>
                </div>

                <button type="submit" id="submitBtn" class="submit-btn">
                    <span class="btn-text">Enviar Feedback</span>
                    <div class="spinner hidden"></div>
                </button>
            </form>
        </div>
    </main>

    <script src="js/app.js"></script>
</body>
</html>
